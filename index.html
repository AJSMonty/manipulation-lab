    <noscript>
      <article style="max-width: 720px; margin: 2rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1>The Manipulation Lab</h1>
        <p>
          How social media rewires your beliefs — and what to do about it. A free interactive
          experience for parents, educators, and anyone who uses the internet.
        </p>
        <h2>What you will learn</h2>
        <ul>
          <li>
            <strong>The Fake Expert</strong> — credentialed-sounding titles that bypass critical
            thinking
          </li>
          <li>
            <strong>Emotional Hijack</strong> — strong feelings that fire before facts are checked
          </li>
          <li>
            <strong>Social Proof</strong> — likes and shares treated as evidence of truth
          </li>
          <li>
            <strong>False Urgency</strong> — time pressure that switches off verification
          </li>
        </ul>
        <h2>How AI chatbots manipulate you</h2>
        <ul>
          <li><strong>Sycophancy</strong> — the AI agrees with your premise before checking it</li>
          <li>
            <strong>False Authority</strong> — confident answers citing studies and documents that
            do not exist
          </li>
          <li><strong>Fake Comfort</strong> — empathy and flattery that lower your scrutiny</li>
          <li>
            <strong>Illusory Balance</strong> — "both sides" framing that quietly buries the
            accurate side
          </li>
        </ul>
        <h2>Includes</h2>
        <p>
          A live belief-shift experiment on a fabricated social feed or a scripted AI chat, a
          spotting quiz, a build-your-own-post exercise, research on prebunking and inoculation
          theory, and a printable 30-minute classroom lesson plan for ages 10–12 based on
          Cambridge University research and the SIFT method.
        </p>
        <p>Enable JavaScript to run the full interactive experience.</p>
