      <article style="max-width: 720px; margin: 2rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1>The Manipulation Lab</h1>
        <p>
          How feeds, chatbots and fake calls change your mind, and what to do about it. A free
          ten minute experiment for parents, teachers and anyone with a phone.
        </p>
        <h2>Five tricks</h2>
        <ul>
          <li><strong>The Fake Expert.</strong> A title that persuades before you read the claim.</li>
          <li><strong>Emotional Hijack.</strong> A strong feeling that arrives before you can think.</li>
          <li><strong>Social Proof.</strong> Likes and shares treated as evidence.</li>
          <li><strong>False Urgency.</strong> A deadline that stops you checking.</li>
          <li>
            <strong>The Borrowed Voice.</strong> A cloned voice, generated face or faked number
            that seems to be someone you trust.
          </li>
        </ul>
        <h2>If someone asks for money</h2>
        <ul>
          <li>Ask for your family safe word.</li>
          <li>Hang up and ring back on a number you already have. For UK banks, dial 159.</li>
          <li>Never move money on the same call.</li>
          <li>Tell someone before you pay.</li>
        </ul>
        <h2>What is on the page</h2>
        <p>
          A belief-shift experiment with a made-up social feed, a scripted AI chatbot and four
          fake calls; a spotting quiz; a build-your-own-post exercise; a summary of the research
          with sources; a 30 minute lesson plan for ages 10 to 12; and a one-page family sheet
          to print.
        </p>
        <p>Turn on JavaScript to run the interactive version.</p>
